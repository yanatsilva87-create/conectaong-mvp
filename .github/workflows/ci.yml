name: CI - ConectaONG

on:
  push:
    branches:
      - main
      - feature/revisao-acessibilidade
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes automatizados
        run: npx vitest run